<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 90" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 5)">
    <!-- 3D Geometric Cube / Exchange Box Icon -->
    <g transform="translate(0, 0)">
      <!-- Top Face -->
      <polygon points="40,6 74,25 40,36 6,25" fill="url(#cubeTop)" />
      
      <!-- Left Face -->
      <polygon points="6,27 38,38 38,74 6,56" fill="url(#cubeLeft)" />
      
      <!-- Right Face -->
      <polygon points="42,38 74,27 74,56 42,74" fill="url(#cubeRight)" />
      
      <!-- Equipment Box Portal / Cutout Center Line -->
      <path d="M 40,38 L 40,73" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Cyclic Circulation Curved Path -->
      <path d="M 17,45 Q 40,60 63,45" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="3,2.5" stroke-linecap="round"/>
      
      <!-- Return & Borrow Direction Arrows -->
      <polygon points="15,41 23,45 19,49" fill="#0284C7"/>
      <polygon points="65,41 57,45 61,49" fill="#F59E0B"/>
      
      <!-- Core Amber Node / Student Focus Anchor -->
      <circle cx="40" cy="30" r="4.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>

    <!-- Text Group in ONE HORIZONTAL LINE -->
    <g transform="translate(92, 0)">
      <!-- "BorrowHub" English Wordmark -->
      <text x="0" y="53" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.03em" fill="#1E3A8A">
        Borrow<tspan fill="#0284C7">Hub</tspan>
      </text>

      <!-- Amber Dot Accent -->
      <circle cx="253" cy="32" r="5" fill="#F59E0B"/>

      <!-- Vertical Divider Line -->
      <line x1="280" y1="18" x2="280" y2="62" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>

      <!-- Arabic Subtitle / Description in the SAME line -->
      <text x="302" y="50" font-family="'IBM Plex Sans Arabic', 'Cairo', system-ui, sans-serif" font-size="21" font-weight="600" fill="#475569" letter-spacing="0">
        منصة استعارة وإدارة المعدات الجامعية
      </text>
    </g>
  </g>
</svg>